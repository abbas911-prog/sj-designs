name: memo-thumbs
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: memo-thumbs
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow cryptography
      - run: python tools/thumbs.py
        env:
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          MEMO_PASSWORD: ${{ secrets.MEMO_PASSWORD }}
      # 21 Oct 2026: the owner costing (was its own workflow memo-costing, one more push + Pages publish after every sync):
      # now part of the same run and the same commit. GitHub Pages publishes at most ~10 times an hour per site.
      - run: python tools/costing.py || echo "costing skipped"
        env:
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      - run: |
          git config user.name "memo-bot"
          git config user.email "memo-bot@users.noreply.github.com"
          git add -A thumbs
          if [ -f memo-data.enc ]; then git add memo-data.enc; fi
          mkdir -p cthumbs && git add -A cthumbs
          if [ -f costing.enc ]; then git add costing.enc; fi
          git diff --cached --quiet || (git commit -m "memo photos sync" && git pull --rebase && git push)
