name: memo-page2
run-name: page2 ${{ fromJSON(inputs.req).id }}
# Started by Jarvis on the PC through the relay (op=cjob), 23 Nov 2026: writes ONE customer's own link page of the new catalogue
# (my-<name>.html) and the picture WhatsApp shows for that link (og-my-<name>.jpg). It does not touch the old catalogue or any other file.
on:
  workflow_dispatch:
    inputs:
      req: { description: 'request (JSON, from Jarvis through the relay)', required: true }
      sig: { description: 'signature (shop password)', required: true }
permissions:
  contents: write
concurrency: { group: memo-page2, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        timeout-minutes: 5
        run: pip install -q pillow
      - name: Make the customer's link page and its picture
        env:
          MEMO_PASSWORD: ${{ secrets.MEMO_PASSWORD }}
          REQ: ${{ inputs.req }}
          SIG: ${{ inputs.sig }}
        run: python3 tools/page2/build.py
      - name: Publish
        run: |
          git config user.name memo-bot; git config user.email memo-bot@users.noreply.github.com
          git add -A jobs
          for f in my-*.html og-my-*.jpg; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -q -m "page2: $(ls -t jobs | head -1)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
