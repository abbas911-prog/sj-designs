name: memo-catalog
run-name: catalog ${{ fromJSON(inputs.req).id }}
# Started from memo.html (Catalogue) through the relay: builds a customer catalogue page from design numbers + SETS/COMPLETE.
on:
  workflow_dispatch:
    inputs:
      req: { description: 'request (JSON, from memo.html)', required: true }
      sig: { description: 'signature (shop password)', required: true }
permissions:
  contents: write
concurrency: { group: memo-catalog, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        # 23 Oct 2026: nothing from apt any more - the runner has no ffmpeg and apt-get took > 4 min (job failed, Abbas: "why did it stop").
        # imageio-ffmpeg (PyPI, seconds) carries its own ffmpeg; the Arabic font is in tools/catalog/fonts since 22 Oct.
        timeout-minutes: 5
        run: pip install -q pillow numpy imageio-ffmpeg
      - name: Build the catalogue
        env:
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          MEMO_PASSWORD: ${{ secrets.MEMO_PASSWORD }}
          REQ: ${{ inputs.req }}
          SIG: ${{ inputs.sig }}
        run: python3 tools/catalog/build.py
      - name: Publish
        run: |
          git config user.name memo-bot; git config user.email memo-bot@users.noreply.github.com
          git add -A jobs vid *.html og-*.jpg
          if [ -f costs.enc ]; then git add costs.enc; fi
          git commit -q -m "catalogue: $(ls -t jobs | head -1)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
