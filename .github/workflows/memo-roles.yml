name: memo-roles
on:
  workflow_run:
    workflows: [memo-thumbs]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: memo-roles
jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: chk
        run: python tools/roles.py --check
      - if: steps.chk.outputs.need == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-b32
      - if: steps.chk.outputs.need == '1'
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers pillow
          python tools/roles.py
      - run: |
          git config user.name "memo-bot"
          git config user.email "memo-bot@users.noreply.github.com"
          git add thumbs/roles.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "memo photo roles" && git pull --rebase && git push)
