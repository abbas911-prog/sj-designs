<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SJ fast lane · code</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf7f2;color:#2b2118}h2{margin:0 0 6px}p,li{font-size:16px;line-height:1.45}
button{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;background:#b8860b;color:#fff;margin:12px 0}
textarea{width:100%;height:120px;font:12px monospace;border:1.5px solid #ddd;border-radius:10px;padding:8px;box-sizing:border-box}#st{font-weight:700;min-height:22px}
a.b{display:block;text-align:center;border:1.5px solid #b8860b;border-radius:14px;padding:14px;font-weight:800;color:#8a6508;text-decoration:none;margin:8px 0}</style></head><body>
<h2>🚀 SJ fast lane — the worker code</h2>
<p>1. Tap <b>Copy the code</b>.<br>2. In Cloudflare, open your worker <b>sj-fast</b> → <b>Edit code</b> → press and hold in the code → <b>Select All</b> → <b>Paste</b> → <b>Deploy</b>.</p>
<button id="cp">📋 Copy the code</button><div id="st">Loading the code…</div>
<a class="b" href="https://dash.cloudflare.com/?to=/:account/workers-and-pages" target="_blank" rel="noopener">Open Cloudflare Workers ↗</a>
<textarea id="code" readonly></textarea>
<script>
var code = '';
fetch('tools/fast-worker.js?t=' + Date.now()).then(function(r){ return r.text(); }).then(function(t){ code = t; document.getElementById('code').value = t; document.getElementById('st').textContent = 'Ready · ' + t.split('\n').length + ' lines'; })
  .catch(function(){ document.getElementById('st').textContent = 'Could not load — check the internet and reload'; });
document.getElementById('cp').onclick = async function(){ var st = document.getElementById('st'); if (!code) return;
  try { await navigator.clipboard.writeText(code); st.textContent = '✅ Copied — now paste it in Cloudflare'; }
  catch(e){ var ta = document.getElementById('code'); ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); var ok = false; try { ok = document.execCommand('copy'); } catch(x){} st.textContent = ok ? '✅ Copied — now paste it in Cloudflare' : 'Press and hold in the box below → Select All → Copy'; } };
</script></body></html>
