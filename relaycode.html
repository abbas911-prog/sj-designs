<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SJ relay · code</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf7f2;color:#2b2118}h2{margin:0 0 6px}p,li{font-size:16px;line-height:1.45}
button{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;background:#b8860b;color:#fff;margin:12px 0}
textarea{width:100%;height:120px;font:12px monospace;border:1.5px solid #ddd;border-radius:10px;padding:8px;box-sizing:border-box}#st{font-weight:700;min-height:22px}
a.b{display:block;text-align:center;border:1.5px solid #b8860b;border-radius:14px;padding:14px;font-weight:800;color:#8a6508;text-decoration:none;margin:8px 0}</style></head><body>
<!-- 20 Oct 2026: the relay code for Abbas to copy on his phone - always loaded fresh from tools/relay.gs in this repo (never an old copy) -->
<h2>🔗 SJ relay — the code</h2>
<p>1. Tap <b>Copy the code</b>.<br>2. Open <b>Apps Script</b> → your SJ relay project → press and hold in the code → <b>Select All</b> → <b>Paste</b> → <b>Save</b> 💾.<br>3. <b>Deploy</b> → <b>Manage deployments</b> → ✏️ → Version: <b>New version</b> → <b>Deploy</b>. (Never “New deployment”.)</p>
<button id="cp">📋 Copy the code</button><div id="st">Loading the code…</div>
<a class="b" href="https://script.google.com/home" target="_blank" rel="noopener">Open Apps Script ↗</a>
<textarea id="code" readonly></textarea>
<script>
var code = '';
fetch('tools/relay.gs?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); }).then(function(t){ code = t; document.getElementById('code').value = t;
    var n = (t.match(/^function /gm) || []).length; document.getElementById('st').textContent = 'Ready · ' + t.split('\n').length + ' lines · ' + n + ' functions · complete: ' + (/function timo\(/.test(t) && /function facDaily\(/.test(t) && /function doPost\(/.test(t) ? 'yes ✅' : 'NO ⚠ reload'); })
  .catch(function(){ document.getElementById('st').textContent = 'Could not load — check the internet and reload'; });
document.getElementById('cp').onclick = async function(){ var st = document.getElementById('st'); if (!code) return;
  try { await navigator.clipboard.writeText(code); st.textContent = '✅ Copied — now paste it in Apps Script'; }
  catch(e){ var ta = document.getElementById('code'); ta.focus(); ta.select(); ta.setSelectionRange(0, code.length); var ok = false; try { ok = document.execCommand('copy'); } catch(x){} st.textContent = ok ? '✅ Copied — now paste it in Apps Script' : 'Press and hold in the box below → Select All → Copy'; } };
</script></body></html>
