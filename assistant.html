<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant</title>
<meta name="theme-color" content="#5b4cf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assistant">
<link rel="manifest" href="assistant.webmanifest">
<link rel="apple-touch-icon" href="memo-icon-180.png">
<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#0f172a;--sub:#64748b;--faint:#94a3b8;--line:#e8eaf3;--soft:#eef0fb;
  --pri:#5b4cf0;--grad:linear-gradient(135deg,#5b4cf0 0%,#8b5cf6 55%,#ec4899 100%);--s:#3b82f6;--f:#10b981;--e:#f59e0b;--wa:#22c55e;--red:#ef4444;--me:#ede9fe;--sys:#f1f5f9;
  --sh:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);--r:20px}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d17;--card:#151827;--ink:#eef0ff;--sub:#9aa3bf;--faint:#6b7391;--line:#242842;--soft:#1c2036;--me:#2e2560;--sys:#1c2036;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
/* top */
.hero{background:var(--grad);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 20px 54px;border-radius:0 0 30px 30px;position:relative}
.hero .top{display:flex;align-items:center;gap:8px}
.hero .hi{font-size:13px;opacity:.85;flex:1}
.live{font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:#86efac;box-shadow:0 0 0 3px rgba(134,239,172,.25)}
.live.bad i{background:#fca5a5;box-shadow:0 0 0 3px rgba(252,165,165,.25)}
.hero h1{margin:8px 0 2px;font-size:28px;letter-spacing:-.02em}
.hero p{margin:0;opacity:.9;font-size:14px}
.stats{display:flex;gap:10px;margin:-36px 16px 0;position:relative;z-index:2}
.stat{flex:1;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--sub)}
.stat.s b{color:var(--s)}.stat.f b{color:var(--f)}.stat.e b{color:var(--e)}
main{padding:6px 16px calc(110px + env(safe-area-inset-bottom))}
.h2{display:flex;align-items:center;margin:22px 4px 10px}
.h2 h2{margin:0;font-size:17px;flex:1;letter-spacing:-.01em}
.h2 button{font-size:13px;color:var(--pri);font-weight:600}
/* catch-up cards */
.card{background:var(--card);border-radius:var(--r);padding:14px 14px 10px;margin-bottom:12px;box-shadow:var(--sh)}
.card.fresh{animation:up .25s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.card .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.tag{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:11px;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--sub);white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.tag i{width:7px;height:7px;border-radius:50%;flex:none}
.tag.s i{background:var(--s)}.tag.f i{background:var(--f)}.tag.e i{background:var(--e)}
.card .meta .t{margin-left:auto;white-space:nowrap}
.card h3{margin:8px 0 8px;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .n{background:var(--red);color:#fff;font-size:12px;border-radius:20px;padding:1px 8px}
.card h3 small{font-weight:500;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{display:flex;gap:10px;padding:6px 0}
.ln+.ln{border-top:1px dashed var(--line)}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.ln div{min-width:0;flex:1}
.ln b{font-size:13px}
.ln p{margin:1px 0 0;font-size:14.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ln em{font-style:normal;font-size:11px;color:var(--faint);margin-left:6px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:9px 0;border-radius:14px;background:var(--soft);font-weight:600;font-size:13.5px}
.acts button.p{background:var(--pri);color:#fff}
.zero{text-align:center;padding:40px 20px;color:var(--sub)}
.zero b{display:block;font-size:42px;margin-bottom:6px}
/* list rows */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--sh);margin:18px 0 10px}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chips button{background:var(--card);border-radius:20px;padding:7px 14px;font-size:13px;white-space:nowrap;box-shadow:var(--sh);font-weight:500}
.chips button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 12px;background:var(--card);border-radius:16px;margin-bottom:8px;box-shadow:var(--sh)}
.row .ic{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px}
.row .ic.s{background:rgba(59,130,246,.12)}.row .ic.f{background:rgba(16,185,129,.13)}.row .ic.e{background:rgba(245,158,11,.14)}.row .ic.w{background:rgba(34,197,94,.15)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{font-size:11px;color:var(--faint);text-align:right;flex:none}
.row .rt i{display:inline-block;margin-top:4px;background:var(--red);color:#fff;font-style:normal;border-radius:20px;padding:0 7px;font-weight:700;font-size:11px}
/* today */
.now{background:var(--grad);color:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);width:100%;text-align:left;margin-top:18px}
.now small{opacity:.85;font-size:12px;font-weight:600;letter-spacing:.03em}
.now h3{margin:4px 0;font-size:19px}
.now .bar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:10px}
.now .bar i{display:block;height:100%;background:#fff;border-radius:4px}
.blk{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:11px 14px;margin-bottom:8px;box-shadow:var(--sh);border-left:4px solid var(--line)}
.blk.cur{border-left-color:var(--pri)}.blk.done{opacity:.5}
.blk .tm{font-size:12px;color:var(--sub);width:70px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.wa{background:var(--wa)}
.btn.full{width:100%}
/* bottom nav */
nav{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:8;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.15);display:flex;padding:6px}
nav button{flex:1;padding:8px 0;border-radius:18px;font-size:12px;font-weight:600;color:var(--sub);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button b{font-size:19px;line-height:1.2}
nav button.on{background:var(--soft);color:var(--pri)}
nav i{position:absolute;top:2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;min-width:17px}
/* chat */
#chat{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.chd{background:var(--grad);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;display:flex;align-items:center;gap:10px}
.chd .back{font-size:28px;line-height:1;width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.18)}
.chd .tt{flex:1;min-width:0}
.chd .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chd .tt small{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chd .kp{background:rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.chd .kp.on{background:#fff;color:#b45309}
.chd .nx{background:#fff;color:var(--pri);border-radius:14px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.cu{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--sub);font-size:12px;font-weight:600;text-align:center;padding:6px;border-radius:12px;margin-bottom:8px}
.go{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--grad);color:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);margin-bottom:14px}
.go b{font-size:17px;display:block}.go small{opacity:.9;font-size:12.5px}.go .pl{margin-left:auto;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
/* ask */
.ask{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-top:18px}
.ask textarea{width:100%;border:0;outline:none;background:var(--bg);border-radius:14px;padding:12px;min-height:84px;resize:none}
.ask .bar{display:flex;gap:8px;margin-top:10px}
.ask .bar button{flex:1;padding:12px 0;border-radius:14px;font-weight:700;background:var(--soft)}
.ask .bar button.p{background:var(--grad);color:#fff;flex:2}
.ask .bar button.rec{background:var(--red);color:#fff;animation:pulse 1s infinite}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ex button{background:var(--soft);border-radius:20px;padding:7px 12px;font-size:13px}
.ans{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-top:12px;white-space:pre-wrap}
.ans.err{border-left:4px solid var(--red)}
.ans .acts{margin-top:10px}
.ans .sh{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:8px 12px;margin-top:10px;font-size:14px}.ans .sh small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}.ans .sh img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-top:6px;background:var(--soft);min-height:60px;object-fit:contain}.ans .sh .fl{margin-right:6px}
.ans .act{background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:14px}.ans .act b{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
#csum{background:var(--me);border-left:4px solid var(--pri);margin:10px 12px 0;padding:10px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;position:relative}#csum button{position:absolute;top:6px;right:10px;color:var(--sub);font-weight:700}
.hero .gear{font-size:18px;background:rgba(255,255,255,.18);border-radius:20px;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.ask .bar button.drv{background:var(--f);color:#fff}.ask .bar button.drv.on{background:var(--red);animation:pulse 1.2s infinite}
.setup textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--bg);outline:none;font-size:13px}
#cbody{flex:1;overflow-y:auto;padding:12px 12px 18px;-webkit-overflow-scrolling:touch}
.day{text-align:center;margin:12px 0 8px}
.day span{font-size:11px;font-weight:700;color:var(--sub);background:var(--soft);padding:4px 10px;border-radius:20px}
.m{display:flex;gap:8px;margin-bottom:8px;align-items:flex-end}
.m .av{width:28px;height:28px;font-size:11px}
.m .bb{max-width:78%;background:var(--card);border-radius:18px 18px 18px 6px;padding:8px 12px;box-shadow:var(--sh);position:relative;overflow-wrap:anywhere}
.m.me{flex-direction:row-reverse}
.m.me .bb{background:var(--me);border-radius:18px 18px 6px 18px}
.m .w{font-size:12px;font-weight:700;margin-bottom:1px}
.m .x{white-space:pre-wrap}
.m .tm{font-size:10.5px;color:var(--faint);text-align:right;margin-top:3px}
.m .fw{width:30px;height:30px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:14px;flex:none;align-self:center;color:var(--sub)}
.m.sys{justify-content:center}.m.sys .bb{background:var(--sys);box-shadow:none;font-size:13px;color:var(--sub);border-radius:14px;max-width:92%;text-align:center}
.m.root .bb{max-width:92%;border:1.5px dashed var(--line);box-shadow:none}
.m.pend{opacity:.55}.m.fail .bb{outline:1.5px solid var(--red)}
.m img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-top:6px;background:var(--soft);min-width:140px;min-height:90px;object-fit:cover}
.m audio,.m video{display:block;width:240px;max-width:100%;margin-top:6px;border-radius:10px}
.fl{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:var(--soft);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:600}
.rp{font-size:11px;color:var(--pri);font-weight:600;margin-top:4px}
.cft{padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
#tgt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:0 6px 6px}
#tgtb{background:var(--soft);border-radius:20px;padding:4px 10px;font-weight:600;color:var(--pri);font-size:12px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tgt.wa #tgtb{color:#15803d;background:rgba(34,197,94,.15)}
#atts{display:flex;gap:8px;overflow-x:auto;padding:0 4px 8px}
#atts span{position:relative;flex:none;background:var(--card);border-radius:12px;padding:5px 24px 5px 8px;font-size:12px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:var(--sh)}
#atts span img{height:48px;display:block;border-radius:8px}
#atts span button{position:absolute;top:2px;right:5px;font-size:14px;color:var(--red)}
.pill{display:flex;align-items:flex-end;gap:4px;background:var(--card);border-radius:26px;padding:5px;box-shadow:var(--sh)}
.pill .ib{width:38px;height:38px;border-radius:50%;font-size:18px;flex:none;color:var(--sub)}
.pill .ib.rec{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
#ctxt{flex:1;resize:none;border:0;outline:none;background:none;padding:9px 4px;max-height:120px;min-height:38px}
#csend{width:42px;height:38px;border-radius:20px;background:var(--grad);color:#fff;font-size:17px;flex:none}
#csend.wa{background:var(--wa)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,12,25,.45);display:flex;align-items:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet>div{background:var(--bg);width:100%;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:slide .2s ease}
@keyframes slide{from{transform:translateY(30px)}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px}
.sheet textarea{width:100%;border:0;background:var(--card);border-radius:14px;padding:12px;min-height:70px;box-shadow:var(--sh);outline:none}
.sheet .acts button{padding:13px 0}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.prev img{height:80px;border-radius:12px}
.prev span{font-size:12px;background:var(--soft);border-radius:10px;padding:5px 9px}
.q{font-size:13px;color:var(--sub);background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:10px;border-left:3px solid var(--pri)}
/* setup */
.setup{max-width:460px;margin:0 auto;padding:22px 18px}
.setup .box{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.setup h2{margin:0 0 4px;font-size:19px}
.setup p{color:var(--sub);font-size:14px;margin:6px 0}
.setup label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.setup input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);outline:none}
.setup input:focus{border-color:var(--pri)}
.step{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.step i{width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--pri);font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
#talk{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#2a1f6b 0%,#0b0d17 60%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(18px + env(safe-area-inset-bottom))}
#talk .tb{width:100%;display:flex;align-items:center;gap:10px}#talk .tb b{flex:1;font-size:15px}#talk .tb button{background:rgba(255,255,255,.14);border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px}
#talk .orb{width:170px;height:170px;border-radius:50%;margin:26px 0 10px;background:radial-gradient(circle at 35% 30%,#c4b5fd,#7c3aed 55%,#ec4899);box-shadow:0 0 60px rgba(139,92,246,.55);transition:transform .25s,box-shadow .25s}
#talk.listening .orb{animation:breathe 1.6s ease-in-out infinite;box-shadow:0 0 70px rgba(52,211,153,.6);background:radial-gradient(circle at 35% 30%,#a7f3d0,#10b981 55%,#2563eb)}
#talk.thinking .orb{animation:spin 1.2s linear infinite;background:conic-gradient(#7c3aed,#ec4899,#f59e0b,#7c3aed)}
#talk.speaking .orb{animation:breathe .9s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}
#talk .st{font-size:15px;opacity:.85;min-height:22px;text-align:center}
#talk .log{flex:1;width:100%;max-width:560px;overflow-y:auto;margin:14px 0;display:flex;flex-direction:column;gap:8px}
#talk .log div{max-width:88%;padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
#talk .log .u{align-self:flex-end;background:rgba(255,255,255,.16)}#talk .log .a{align-self:flex-start;background:rgba(124,58,237,.35)}#talk .log .e{align-self:center;background:rgba(239,68,68,.25);font-size:13px;text-align:center}
#talk .bb{width:100%;max-width:560px;display:flex;gap:8px;align-items:center}
#talk .hold{flex:1;background:#fff;color:#4c1d95;border-radius:24px;padding:16px 0;font-weight:800;font-size:16px;text-align:center;user-select:none;-webkit-user-select:none}
#talk .hold.on{background:#10b981;color:#fff}
#talk .yes{background:#10b981;color:#fff;border-radius:24px;padding:16px 18px;font-weight:800}#talk .no{background:rgba(255,255,255,.14);border-radius:24px;padding:16px 16px;font-weight:700}
#talk input{flex:1;border:0;border-radius:24px;padding:14px 16px;background:rgba(255,255,255,.14);color:#fff;outline:none;font-size:15px}
#tkmini{display:flex;align-items:center;gap:8px;background:#1b1540;color:#fff;padding:8px 12px;font-size:13px}#tkmini .dot{width:12px;height:12px;border-radius:50%;background:#7c3aed;flex:none}#tkmini.listening .dot{background:#10b981;animation:breathe 1.4s infinite}#tkmini.thinking .dot{background:#f59e0b;animation:breathe .7s infinite}#tkmini.speaking .dot{background:#ec4899;animation:breathe .9s infinite}#tkmini span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tkmini button{background:rgba(255,255,255,.16);border-radius:14px;padding:6px 10px;font-weight:700;font-size:12px;white-space:nowrap}#tkmini button.on{background:#10b981}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:90%;opacity:0;transition:.2s;pointer-events:none;font-weight:600}
#toast.show{opacity:1;transform:translateX(-50%)}
#timo{position:fixed;inset:0;z-index:30;background:#fff}
#timo iframe{border:0;width:100%;height:100%}
#timox{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:31;background:var(--ink);color:var(--bg);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div id="setup" class="setup" hidden></div>

<div id="app" hidden>
  <div class="hero">
    <div class="top"><span class="hi" id="hdate"></span><span class="live" id="live"><i></i><span id="lvt">Connecting</span></span><button class="gear" id="tkopen" type="button" aria-label="Talk">🎙</button><button class="gear" id="gear" type="button" aria-label="Settings">⚙️</button></div>
    <h1 id="hello">Good morning</h1>
    <p id="hsum">Getting your chats…</p>
  </div>
  <div class="stats" id="stats"><div class="stat"><b id="sn">–</b><span>new messages</span></div><div class="stat s"><b id="ss">–</b><span>SJTC chats</span></div><div class="stat f"><b id="sf">–</b><span>Factory chats</span></div><div class="stat e" id="ste" hidden><b id="se">–</b><span>Emails</span></div></div>
  <main>
    <section id="v-catch"><div id="today1"></div><div id="clist"></div></section>
    <section id="v-chats" hidden>
      <label class="search">🔎<input id="q" placeholder="Search a name, design, channel…" autocomplete="off"></label>
      <div class="chips" id="fchips"><button data-f="" class="on" type="button">All</button><button data-f="s" type="button">SJTC</button><button data-f="f" type="button">Factory</button><button data-f="e" type="button" id="chipe" hidden>✉️ Email</button><button data-f="c" type="button">Channels</button><button data-f="un" type="button">Unread</button></div>
      <div id="alist"></div>
    </section>
    <section id="v-today" hidden><div id="tday"></div></section>
    <section id="v-ask" hidden>
      <div class="h2"><h2>✨ Ask your assistant</h2></div>
      <div class="ask"><textarea id="atxt" placeholder="Type a command or a question…&#10;e.g. send 20 m lace ordered to #cash&#10;open 48188 · what's new · forward last photo of 48188 to whatsapp"></textarea>
        <div class="bar"><button type="button" id="amic" aria-label="Speak">🎤 Speak</button><button type="button" class="drv" id="adrive" aria-label="Talk">🎙 Talk</button><button type="button" class="p" id="ago">Ask ➤</button></div><div id="aikey" class="err" hidden>No AI key yet — add it in ⚙️ Settings to ask anything. Without it only the fixed commands work.</div>
        <div class="ex" id="aex"><button type="button">what's on my plate</button><button type="button">what's new</button><button type="button">status of 48188</button><button type="button">open 48188</button><button type="button">send ok noted to #cash</button><button type="button">forward last photo of 48188 to whatsapp</button><button type="button">mark all done</button></div></div>
      <div id="aout"></div>
    </section>
  </main>
  <nav id="nav">
    <button data-v="catch" class="on" type="button"><b>⚡</b>Catch-up<i id="nb" hidden></i></button>
    <button data-v="chats" type="button"><b>💬</b>Chats</button>
    <button data-v="today" type="button"><b>🗓</b>Today</button>
    <button data-v="ask" type="button"><b>✨</b>Ask</button>
  </nav>
</div>

<section id="chat" hidden>
  <div class="chd"><button class="back" id="cback" type="button" aria-label="Back">‹</button><div class="tt"><b id="ct"></b><small id="cs"></small></div><button class="kp" id="ckeep" type="button" aria-label="Keep unread">🔔</button><button class="nx" id="cnext" type="button" hidden>Next ›</button></div>
  <div id="tkmini" hidden><i class="dot"></i><span id="tkmst">Listening…</span><button type="button" id="tkmhold">🎤 Hold</button><button type="button" id="tkmrec" hidden>■ Done</button><button type="button" id="tkmnext">Next ›</button><button type="button" id="tkmx">✕</button></div><div id="csum" hidden><button type="button" id="csumx">✕</button><span id="csumt"></span></div><div id="cbody"></div>
  <div class="cft">
    <div id="tgt">Sending to <button id="tgtb" type="button"></button></div>
    <div id="atts"></div>
    <div class="pill">
      <button class="ib" id="bcam" type="button" aria-label="Camera">📷</button>
      <button class="ib" id="bfile" type="button" aria-label="Photo or file">＋</button>
      <textarea id="ctxt" rows="1" placeholder="Message…"></textarea>
      <button class="ib" id="bmic" type="button" aria-label="Voice note">🎤</button>
      <button id="csend" type="button" aria-label="Send">➤</button>
    </div>
    <input type="file" id="fcam" accept="image/*,video/*" capture="environment" hidden>
    <input type="file" id="ffile" multiple hidden>
  </div>
</section>
<section id="talk" hidden>
  <div class="tb"><b>🎙 Talk to your assistant</b><button type="button" id="tkmute" aria-label="Mute">🔊</button><button type="button" id="tkx">✕ Close</button></div>
  <div class="orb" id="tkorb"></div><div class="st" id="tkst">Starting…</div>
  <div class="log" id="tklog"></div>
  <div class="bb" id="tkyn" hidden><button type="button" class="yes" id="tkyes">✓ Yes, do it</button><button type="button" class="no" id="tkno">✕ No</button></div>
  <div class="bb"><div class="hold" id="tkhold">🎤 Hold to talk</div></div>
  <div class="bb"><input id="tktxt" placeholder="…or type here" autocomplete="off"><button type="button" class="no" id="tksend">➤</button></div>
</section>
<div class="sheet" id="sheet" hidden><div><div class="grab"></div><div id="sheetb"></div></div></div>
<div id="timo" hidden></div><button id="timox" type="button" hidden>✕ Close Timo</button>
<div id="toast"></div>

<script>
(function(){
var VER = '2026-10-25g';
var $ = function(id){ return document.getElementById(id); };
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} return null; }
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function sleep(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }
function toast(s){ var e = $('toast'); e.textContent = s; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(function(){ e.classList.remove('show'); }, 2800); }
function rid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

// ---------- the Assistant's own backend (tools/assistant.gs, its own Google script — NOT the SJ relay) ----------
var URL_ = ls('as2_url') || '', PW = ls('as2_pw') || '', WHO = ls('as2_who') || 'Abbas';
async function hmacHex(key, msg){
  var k = await crypto.subtle.importKey('raw', new TextEncoder().encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return Array.from(new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)))).map(function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
}
var LASTOK = 0, LASTERR = '';
async function raw(body, lim){
  var ac = window.AbortController ? new AbortController() : null, tm = ac ? setTimeout(function(){ ac.abort(); }, lim || 30000) : null;
  try { var r = await fetch(URL_, { method: 'POST', body: JSON.stringify(body), cache: 'no-store', credentials: 'omit', signal: ac ? ac.signal : undefined }); var t = await r.text(); clearTimeout(tm);
    try { return JSON.parse(t); } catch(e){ return { ok: false, error: 'Google sent a web page instead of an answer (' + r.status + ') — is the link right and deployed for "Anyone"?' }; } }
  catch(e){ clearTimeout(tm); return { ok: false, error: e.name === 'AbortError' ? 'no answer in time' : 'no connection (' + e.message + ')' }; }
}
async function api(o, tries){
  o.t = Date.now(); o.who = WHO; var req = JSON.stringify(o), sig = await hmacHex(PW, req), lim = o.op === 'up' ? 120000 : o.op === 'file' ? 45000 : 30000, j;
  for (var n = 0; n < (tries || 2); n++) { if (n) await sleep(1500 * n); j = await raw({ req: req, sig: sig }, lim); if (j.ok || /wrong password|unknown op|bad chat|not set up/.test(j.error || '')) break; }
  if (j.ok) { LASTOK = Date.now(); LASTERR = ''; } else if (o.op === 'feed') LASTERR = j.error; liveLine(); return j;
}

// ---------- colours for people ----------
var PAL = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316', '#0ea5e9'];
function col(n){ var h = 0, s = String(n || '?').toUpperCase(); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PAL[h % PAL.length]; }
function ini(n){ var p = String(n || '?').replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
function av(n){ return '<span class="av" style="background:' + col(n) + '">' + esc(ini(n)) + '</span>'; }
function isMe(w){ var a = String(w || '').toUpperCase().replace(/[^A-Z ]/g, '').trim().split(' ')[0], b = String(WHO).toUpperCase().replace(/[^A-Z ]/g, '').trim().split(' ')[0]; return a.length >= 3 && b.length >= 3 && (a === b || a.indexOf(b) === 0 || b.indexOf(a) === 0); }
function when(ts){ if (!+ts) return ''; var d = new Date(+ts * 1000), now = new Date(), y = new Date(now - 864e5);
  var t = (d.getHours() % 12 || 12) + ':' + ('0' + d.getMinutes()).slice(-2) + (d.getHours() < 12 ? ' am' : ' pm');
  return d.toDateString() === now.toDateString() ? t : d.toDateString() === y.toDateString() ? 'Yesterday' : d.getDate() + ' ' + 'Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[d.getMonth()]; }
function dayName(ts){ var d = new Date(+ts * 1000), now = new Date(); if (d.toDateString() === now.toDateString()) return 'Today'; if (d.toDateString() === new Date(now - 864e5).toDateString()) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }); }

// ---------- data ----------
var CH = {}, ORDER = [], ZERO = {}, EMAIL = ls('as2_email') || '', AI = ls('as2_ai') === '1', HIST = [], DRIVE = false, PENDA = null, VOICEIN = false, TTS = ls('as2_tts') || '', AUD = null;      // EMAIL = the Gmail address the script reads (empty until the script allows Gmail)
function wsName(w){ return w === 's' ? 'SJTC' : w === 'e' ? 'Email' : 'Factory'; }
function tagOf(c){ return c.ws === 'e' ? 'Email · ' + c.chn : wsName(c.ws) + ' · #' + c.chn; }
function chIcon(c){ return c.ws === 'e' ? '✉️' : c.kind === 'channel' ? '💬' : /order memo|customer/.test(c.kind) ? '👤' : /godown/.test(c.kind) ? '📦' : c.ws === 'f' ? '🏭' : '💬'; }
function subOf(c){ if (c.ws === 'e') return 'Email · ' + c.chn; return wsName(c.ws) + ' · #' + c.chn + (c.kind && c.kind !== 'channel' && c.kind !== 'thread' ? ' · ' + c.kind : ''); }
async function loadFeed(fresh){
  if (loadFeed.busy) return; loadFeed.busy = true;
  try { var j = await api({ op: 'feed', fresh: fresh ? 1 : 0 }, 2); if (!j.ok) { if (/wrong password/.test(j.error)) { PW = ''; ls('as2_pw', null); setup(); } return; }
    var M = {}; (j.chats || []).forEach(function(c){ if (ZERO[c.k] && +(c.lines.length ? c.lines[c.lines.length - 1].ts : c.last) <= ZERO[c.k]) { c.un = 0; c.lines = []; } M[c.k] = c; });
    CH = M; ORDER = j.chats.map(function(c){ return c.k; }); if (j.email !== undefined && j.email !== EMAIL) { EMAIL = j.email || ''; ls('as2_email', EMAIL); } if (j.ai !== undefined && !!j.ai !== AI) { AI = !!j.ai; ls('as2_ai', AI ? '1' : '0'); } if (j.tts !== undefined && (j.tts || '') !== TTS) { TTS = j.tts || ''; ls('as2_tts', TTS); } $('aikey').hidden = AI; draw();
  } finally { loadFeed.busy = false; } }
function liveLine(){ var bad = !!LASTERR || navigator.onLine === false; $('live').classList.toggle('bad', bad); $('lvt').textContent = navigator.onLine === false ? 'Offline' : LASTERR ? 'Problem' : LASTOK ? 'Live' : 'Connecting'; $('live').title = LASTERR; }

// ---------- screens ----------
var VIEW = 'catch', FILT = '', SHOWN = {}, LASTH = {};
function setHtml(id, h){ var bare = h.replace(/ fresh"/g, '"'); if (LASTH[id] === bare) return; LASTH[id] = bare; $(id).innerHTML = h; }
function list(){ return ORDER.map(function(k){ return CH[k]; }).filter(Boolean); }
function cardHtml(c){
  var lines = (c.lines || []).map(function(l){ return '<div class="ln">' + av(l.who) + '<div><b style="color:' + col(l.who) + '">' + esc(l.who || '') + '</b><em>' + when(l.ts) + '</em><p>' + esc(l.text) + '</p></div></div>'; }).join('');
  if (!lines && c.un < 0) lines = '<div class="ln"><div><p style="color:var(--sub)">New messages — open to read</p></div></div>';
  var fr = !SHOWN[c.k + c.last]; SHOWN[c.k + c.last] = 1; return '<article class="card' + (fr ? ' fresh' : '') + '" data-card="' + esc(c.k) + '"><div class="meta"><span class="tag ' + c.ws + '"><i></i>' + esc(tagOf(c)) + '</span>' + (c.kind && c.kind !== 'channel' && c.kind !== 'thread' && c.kind !== 'email' ? '<span class="tag">' + esc(c.kind) + '</span>' : '') + '<span class="t">' + when(c.last) + '</span></div>' +
    '<h3>' + esc(chIcon(c) + ' ' + c.title) + (c.un > 0 ? ' <span class="n">' + c.un + '</span>' : '') + '</h3>' + lines +
    '<div class="acts"><button class="p" type="button" data-open="' + esc(c.k) + '">Reply</button><button type="button" data-fwc="' + esc(c.k) + '">↪ Forward</button><button type="button" data-done="' + esc(c.k) + '">✓ Done</button></div></article>'; }
function rowHtml(c, attr){ return '<button class="row" type="button" ' + (attr || 'data-open') + '="' + esc(c.k) + '"><span class="ic ' + c.ws + '">' + chIcon(c) + '</span><span class="tx"><b>' + esc(c.title) + '</b><small>' + esc(c.un > 0 && c.lines && c.lines.length ? c.lines[c.lines.length - 1].who + ': ' + c.lines[c.lines.length - 1].text : subOf(c)) + '</small></span><span class="rt">' + when(c.last) + (c.un ? '<br><i>' + (c.un > 0 ? c.un : '•') + '</i>' : '') + '</span></button>'; }
function greet(){ var h = new Date().getHours(); return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ', ' + (WHO.split(' ')[0] || ''); }
function draw(){
  var L = list(), un = L.filter(function(c){ return c.un; }), tot = un.reduce(function(a, c){ return a + Math.max(c.un, 1); }, 0);
  $('hello').textContent = greet(); $('hdate').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  $('sn').textContent = tot; $('ss').textContent = un.filter(function(c){ return c.ws === 's'; }).length; $('sf').textContent = un.filter(function(c){ return c.ws === 'f'; }).length; var ne = un.filter(function(c){ return c.ws === 'e'; }).length, hasE = L.some(function(c){ return c.ws === 'e'; }) || !!EMAIL; $('se').textContent = ne; $('ste').hidden = !hasE; $('chipe').hidden = !hasE;
  $('hsum').textContent = !L.length ? 'Getting your chats…' : tot ? tot + ' new message' + (tot > 1 ? 's' : '') + ' waiting in ' + un.length + ' chat' + (un.length > 1 ? 's' : '') : 'You are all caught up ✨';
  $('nb').hidden = !tot; $('nb').textContent = tot; document.title = tot ? '(' + tot + ') Assistant' : 'Assistant'; try { if (navigator.setAppBadge) tot ? navigator.setAppBadge(tot) : navigator.clearAppBadge(); } catch(e){}
  if (VIEW === 'catch') { todayCard();
    var h = un.length ? '<button class="go" type="button" id="gocu"><span><b>▶ Catch up</b><small>Open the ' + un.length + ' chat' + (un.length > 1 ? 's' : '') + ' one by one — read, reply, Next</small></span><span class="pl">' + tot + '</span></button><div class="h2"><h2>Needs you</h2><button type="button" id="allread">✓ Mark all done</button></div>' + un.map(cardHtml).join('') : '<div class="zero"><b>' + (L.length ? '✨' : '⏳') + '</b>' + (L.length ? 'All caught up. Nothing new in SJTC, the factory' + (EMAIL ? ', email' : '') + '.' : 'Reading your chats for the first time…') + '</div>';
    var rec = L.filter(function(c){ return !c.un; }).slice(0, 5); if (rec.length) h += '<div class="h2"><h2>Recently</h2></div>' + rec.map(function(c){ return rowHtml(c); }).join('');
    setHtml('clist', h); }
  if (VIEW === 'chats') { var q = $('q').value.trim().toLowerCase(), A = L.filter(function(c){ return (!FILT || (FILT === 'c' ? c.kind === 'channel' : FILT === 'un' ? c.un : c.ws === FILT)) && (!q || (c.title + ' ' + subOf(c) + ' ' + (c.lines || []).map(function(l){ return l.who + ' ' + l.text; }).join(' ')).toLowerCase().indexOf(q) >= 0); });
    setHtml('alist', A.length ? A.slice(0, 250).map(function(c){ return rowHtml(c); }).join('') : '<div class="zero"><b>🔍</b>No chat found.</div>'); }
  if (VIEW === 'today') todayFull();
}
function show(v){ VIEW = v; ['catch', 'chats', 'today', 'ask'].forEach(function(x){ $('v-' + x).hidden = x !== v; }); $('nav').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === v); }); draw(); window.scrollTo(0, 0); }
$('nav').onclick = function(e){ var b = e.target.closest('button'); if (b) show(b.dataset.v); };
$('q').oninput = draw;
$('fchips').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; FILT = b.dataset.f; $('fchips').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); draw(); };
function markDone(k){ var c = CH[k]; if (!c) return; var ts = c.lines && c.lines.length ? c.lines[c.lines.length - 1].ts : String(Date.now() / 1000); ZERO[k] = +ts; c.un = 0; c.lines = []; draw(); api({ op: 'seen', k: k, ts: ts }); }
$('app').addEventListener('click', function(e){
  var o = e.target.closest('[data-open]'); if (o) { openChat(o.dataset.open); return; }
  var d = e.target.closest('[data-done]'); if (d) { markDone(d.dataset.done); return; }
  var f = e.target.closest('[data-fwc]'); if (f) { var c = CH[f.dataset.fwc]; openChat(c.k, true); return; }
  if (e.target.closest('#gocu')) { cuStart(); return; }
  if (e.target.id === 'allread') { list().filter(function(c){ return c.un; }).forEach(function(c){ markDone(c.k); }); toast('✓ All marked done'); return; }
  if (e.target.closest('[data-timo]')) openTimo(); });

// ---------- Today (Timo, read from this phone; Timo owns and syncs its data) ----------
function tState(){ try { var j = JSON.parse(localStorage.getItem('timo-state') || 'null'); if (j && typeof j === 'object') return j; } catch(e){} return null; }
function tK(d){ d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function tOccurs(a, k){ if ((a.skip || []).indexOf(k) >= 0) return false; if (!a.repeat || a.repeat === 'none') return a.date === k; if (k < a.date) return false;
  var p = k.split('-'), wd = new Date(+p[0], +p[1] - 1, +p[2]).getDay(); if (a.repeat === 'daily') return true; if (a.repeat === 'weekdays') return wd >= 1 && wd <= 5;
  if (a.repeat === 'weekly') { var q = a.date.split('-'); return wd === new Date(+q[0], +q[1] - 1, +q[2]).getDay(); } return false; }
function tDay(S, k){ return (S.acts || []).filter(function(a){ return tOccurs(a, k); }).map(function(a){ var o = (S.over || {})[a.id + '@' + k]; return o && o.items ? Object.assign({}, a, { items: o.items }) : a; }).sort(function(x, y){ return x.start - y.start; }); }
function tT(m){ m = ((Math.round(m) % 1440) + 1440) % 1440; var h = Math.floor(m / 60); return (h % 12 || 12) + ':' + ('0' + m % 60).slice(-2) + (h < 12 ? ' am' : ' pm'); }
function tNow(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function todayCard(){ var S = tState(), el = $('today1'); if (!S) { el.innerHTML = ''; return; }
  var n = tNow(), L = tDay(S, tK()), cur = L.filter(function(a){ return a.start <= n && n < a.start + (a.dur || 30); })[0], nx = L.filter(function(a){ return a.start > n; })[0];
  if (!cur && !nx) { el.innerHTML = ''; return; } var a = cur || nx, pct = cur ? Math.min(100, Math.round((n - a.start) / (a.dur || 30) * 100)) : 0;
  el.innerHTML = '<button class="now" type="button" data-timo="1"><small>' + (cur ? 'NOW · UNTIL ' + tT(a.start + (a.dur || 30)) : 'NEXT · ' + tT(a.start)) + '</small><h3>' + esc((a.icon || '') + ' ' + (a.title || a.name || 'Block')) + '</h3>' + (cur && nx ? '<small>Then ' + esc(nx.title || nx.name || '') + ' at ' + tT(nx.start) + '</small>' : '') + (cur ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '') + '</button>'; }

  var f = m.files.filter(function(x){ return fileKind(x) === 'audio' || fileKind(x) === 'video'; })[0]; tkState('thinking', 'Playing…'); if (srec) { try { srec.abort(); } catch(e){} srec = null; }

// hold to talk: press = listen, release = send what was heard (works where the auto loop is flaky)
(function(){ var h = $('tkhold'), hr = null, got = '';
